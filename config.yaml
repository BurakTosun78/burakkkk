# paper : gerçek fiyat, sanal para (API anahtarı gerekmez)
# demo  : Binance demo hesabında gerçek emirler (demo anahtarı gerekir, para riski yok)
# live  : GERÇEK PARA. Ayrıca --confirm-live bayrağı gerekir.
mode: paper

symbol: BTC/USDT:USDT   # USDT-M sürekli vadeli
timeframe: 4h

strategy:
  ema_fast: 20          # hızlı EMA, yavaş EMA'yı yukarı keserse long, aşağı keserse short
  ema_slow: 50
  rsi_period: 14
  rsi_long_max: 70      # RSI bunun üstündeyse long açma (aşırı alım)
  rsi_short_min: 30     # RSI bunun altındaysa short açma (aşırı satım)
  atr_period: 14
  sl_atr: 3.0           # zarar durdur = giriş -/+ 3 x ATR
  tp_atr: 0             # kâr al = giriş +/- N x ATR; 0 = yok, trend ters sinyale kadar taşınır
  allow_short: true     # false: yalnızca long açılır

risk:
  risk_per_trade: 0.01  # stop olursa kasanın en fazla %1'i kaybedilir
  leverage: 3
  max_daily_loss: 0.05  # gün içinde kasa %5 düşerse o gün yeni işlem açılmaz

costs:
  taker_fee: 0.0005     # %0.05 (backtest ve paper için)
  slippage: 0.0002      # %0.02

paper:
  initial_balance: 1000 # USDT
